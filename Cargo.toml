[package]
name = "cryptage"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Chiffrement et déchiffrement de fichiers, hors ligne, avec interface graphique (XChaCha20-Poly1305 + Argon2id)."
repository = "https://github.com/N4ole/cryptage"
readme = "README.md"
keywords = ["encryption", "argon2", "xchacha20poly1305", "gui"]
categories = ["cryptography", "gui"]

[lib]
name = "cryptage"
path = "src/lib.rs"

[[bin]]
name = "cryptage"
path = "src/main.rs"

[dependencies]
aead-stream = { version = "0.6.0", features = ["alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize", "parallel"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
rand = { version = "0.10.4", default-features = false, features = ["sys_rng"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = { version = "1.9.2", features = ["derive"] }
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Les tests de flux (> 1 Go) et Argon2 sont très lents sans optimisation.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
